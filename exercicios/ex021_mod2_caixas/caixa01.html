<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{ /*box level*/
            text-align: center; /*texto centralizado*/
            background-color: beige;/*cor interna da caixa*/
            height: 33px;/*altura caixa*/
            width: 450px;/*largura caixa*/

            border-width: 10px; /*expessura borda*/
            border-style: solid;/*estilo borda*/
            border-color: plum; /*cor borda*/

            border: 10px solid plum;

            margin: auto;

            outline-width: 10px;
            outline-style: dashed;
            outline-color: aquamarine;

            outline: 6px dashed aquamarine;


        }
        a{ /*inline-level*/
            display: inline-block;/*altera o inline level para box level*/
            text-align: center; /*texto centralizado*/
            background-color: beige;/*cor interna da caixa*/
            border-width: 6px; /*expessura borda*/
            border-style: dotted;/*dotted-estilo bolinha,dashed-estilo borda pontilhado, double-linha dupla,groove-borda 3d*/
            border-color: plum; /*cor borda*/

        
            padding-top: 10px; /*espaço de cima entre a borda e o texto*/
            padding-right: 10px; /*espaço da direita entre a borda e o texto*/
            padding-bottom: 10px; /*espaço de baixo entre a borda e o texto*/
            padding-left: 10px;/*espaço da esquerda entre a borda e o texto*/

            padding: 10px 10px 10px 10px;

            margin-top: 0px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;

            margin:  10px 10px 10px 10px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>

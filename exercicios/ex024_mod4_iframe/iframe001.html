<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!-- Tamanho padrão 300px largura x 150px altura
            scolling=rolagem  da barra latereal (auto,yes,no)
    -->
    
    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="auto">

            <a href="https://www.cursoemvideo.com">Curso em video</a>
            
        </iframe>
        para aprender a programar
    </p>
    <p>
        O site do

        <iframe src="https://www.google.com" frameborder="0"></iframe>

            <a href="https://www.google.com">google</a>

        também é muito legal, pena que não funciona dentro do iframe!
    </p>
        O repositório do Gauanabara no

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
            <a href="https://gustavoguanabara.github.io">Github</a>

        </iframe>

        tambem é bem legal!
    <p>

    </p>
</body>
</html>

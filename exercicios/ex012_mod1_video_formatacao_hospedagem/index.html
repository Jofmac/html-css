<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu própio servidor</p>

    <!--
    <video src="midia/Meu-Video.mp4" width="500" controls autoplay loop></video>
    -->

    <video width="560" poster="imagens/abacaxi.png" controls autoplay loop>

        <source src="midia/Meu-Video.webm" type="video/webm">
        <source src="midia/Meu-Video.mkv" type="video/mkv">
        <source src="midia/Meu-Video.mp4" type="mp4">
        <source src="midia/meu-video-orig.ogv" type="ogv">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>

    </video>

    <h1>Inserindo videos do YouTube no HTML</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/xdbeDJuVtwE?si=okK2R-FxqBgRiFd7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>



</body>
</html>

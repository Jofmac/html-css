<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div{
            display: inline-block;/*tudo na mesma linha*/
            border: 1px solid blueviolet;
            color: rgb(255, 255, 255);
            text-align: center;
            background-color: rgb(255, 225, 185);
            height: 200px;
            width: 200px;
        }

        div:hover {
            background-color: rgb(255, 127, 217);
        }/*altera a cor ao passar o mause*/

       
        
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>

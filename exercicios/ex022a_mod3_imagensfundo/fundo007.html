<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            
            position: relative; /*necessário para centralizar o elemento conteudo na tela*/
            height: 500px; /*altura*/
            padding: 10px;
            background-color: purple ;
        }
        #conteudo {
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;

            position: absolute;/*necessário para centralizar o elemento conteudo na tela*/
            height: 200px;
            width: 400px;
            background-color: yellow;
           /* margin: auto; centraliza o objeto mas só serve para alinhamento horizontal*/

           left: 50%;/*necessário para centralizar o elemento conteudo na tela. só pode ser usado com posição absolute*/
           top: 50%;/*necessário para centralizar o elemento conteudo na tela. só pode ser usado com posição absolute*/

           transform: translate(-50%, -50%);/*necessário para centralizar o elemento conteudo na tela*/

        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de tabelas grandes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
            
        }
        caption{
            background-color: black;
            border-color: black;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        td, th {
           border: 1px solid rgb(36, 29, 29); 
           padding: 10px;
        }

        thead > tr > th {
            position: sticky;
            top: 0;
            background-color: gray;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
                        
        }

        td.num {
            text-align: right;
        }

        tbody > tr:nth-child(odd) {
            background-color: rgb(255, 225, 213);
        }

        tbody > tr:nth-child(even) {
            background-color: rgb(255, 213, 253);
        }
        /*odd = impar, even =par*/

    </style>

</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            CAPTION (legenda ou titulo da tabela)
            THEAD cabeça
                TR (linha da tabela), TD(dado da tabela), TH (cabeçalho da tabela)
            TBODY corpo
                TR, TD, TH
            TFOOT pé
                TR,TD, TH
    -->

    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px";> População</th>
                <!--scope="col" é o titulo de uma coluna-->
            </tr>
        </thead>
            
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46.179.008</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.460.311</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.225.410</td>
            </tr> 
            <tr>
                <td>Bahia</td>
                <td class="num">14.889.472</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11.952.456</td>
            </tr>    
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">11.233.317</td>
            </tr>       
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num"><strong >122.939.974</strong></td>
                <!-- scope="row" titulo de uma linha-->
            </tr>
        </tfoot>
    </table>
</body>
</html>

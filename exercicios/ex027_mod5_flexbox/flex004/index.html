<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            height: 300px;

            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;
            align-items: stretch;
        }

        div.item {
            background-color: lightskyblue;
            border:  1px solid black;
            text-align: center;
            padding: 10px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">conteiner A</div>
        <div class="item">conteiner B</div>
        <div class="item">conteiner C</div>
        <div class="item">conteiner D</div>
        <div class="item">conteiner E</div>
        <div class="item">conteiner F</div>
        <div class="item">conteiner G</div>
    </div>
</body>
</html>
